services:
  doctree-auth:
    container_name: doctree-auth
    hostname: auth
    build:
      context: ..
      dockerfile: ./services/auth-service/Dockerfile
    ports:
      - 3001:3000
    env_file:
      - ../config/auth.env
    depends_on:
      - doctree-postgres
    networks:
      - doctree-postgres-net
      - doctree-minio-net
    volumes:
      - ../config/auth.env:/usr/src/app/.env
      - ../services/protos:/usr/src/protos
  
