services:
  doctree-postgres-replica:
    container_name: doctree-postgres-replica
    hostname: pg-replica
    image: postgres:17.4-alpine3.20
    env_file:
      - pg-replica.env
    ports:
      - 5433:5432
    volumes:
      - doctree-postgres-replica-data:/var/lib/postgresql/data
      - ./setup-master.sh:/usr/local/bin/setup-master.sh
      - ./setup-subscription.sh:/usr/local/bin/setup-subscription.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    networks:
      - doctree-postgres-net
    entrypoint: >
      sh -c "
        exec docker-entrypoint.sh postgres -c 'max_connections=50' -c 'shared_buffers=1GB' -c 'effective_cache_size=4GB' -c 'work_mem=16MB' -c 'maintenance_work_mem=512MB' -c 'wal_level=logical' -c 'max_wal_senders=10' -c 'max_replication_slots=10' -c 'listen_addresses=*' &
        
        POSTGRES_PID=$!
        # Wait for PostgreSQL to start
        until pg_isready -U $POSTGRES_USER -d $POSTGRES_DB; do
          echo 'Waiting for PostgreSQL to start...'
          sleep 2
        done
        
        # Some additional time for initialization
        sleep 5
        
        echo 'PostgreSQL is ready. Setting up replication...'
        
        # Run setup scripts
        if [ -f /var/lib/postgresql/data/postgresql.conf ]; then
          echo 'Setting up master replication...'
          /usr/local/bin/setup-master.sh
          
          echo 'Setting up subscription...'
          /usr/local/bin/setup-subscription.sh
        fi
        
        wait $POSTGRES_PID
      "
      
  doctree-postgres-migrator-replica:
    container_name: doctree-postgres-migrator-replica
    hostname: pg-migrator-replica
    build:
      context: ..
      dockerfile: pkg/pgmigrator/Dockerfile
    environment:
      - GOOSE_MIGRATION_DIR=/migrations
    env_file:
      - goose.replica.env
    command:
      - "goose"
      - "up"
    volumes:
      - ../migrations:/migrations
    depends_on:
      doctree-postgres-replica:
        condition: service_healthy
    networks:
      - doctree-postgres-net

  doctree-app-mirror:
    container_name: doctree-app-mirror
    hostname: app-mirror
    build:
      context: ..
      dockerfile: ./src/Dockerfile
    ports:
      - 3003:3000
    env_file:
      - ../config/app.mirror.env
    depends_on:
      - doctree-postgres-replica
    networks:
      - doctree-postgres-net
      - doctree-minio-net
      - doctree-traefik-net
    volumes:
      - ../src:/usr/src/app/src
      - ../config/app.mirror.env:/usr/src/app/app.env
    command: >
        npm run start:dev

  doctree-app-mirror-readonly1:
    container_name: doctree-app-mirror-readonly1
    hostname: app-mirror-readonly1
    build:
      context: ..
      dockerfile: ./src/Dockerfile
    ports:
      - 3004:3000
    env_file:
      - ../config/app.mirror.readonly1.env
    depends_on:
      - doctree-postgres-replica
    networks:
      - doctree-postgres-net
      - doctree-minio-net
      - doctree-traefik-net
    volumes:
      - ../src:/usr/src/app/src
      - ../config/app.mirror.readonly1.env:/usr/src/app/app.env
    command: >
        npm run start:dev

  doctree-app-mirror-readonly2:
    container_name: doctree-app-mirror-readonly2
    hostname: app-mirror-readonly2
    build:
      context: ..
      dockerfile: ./src/Dockerfile
    ports:
      - 3005:3000
    env_file:
      - ../config/app.mirror.readonly2.env
    depends_on:
      - doctree-postgres-replica
    networks:
      - doctree-postgres-net
      - doctree-minio-net
      - doctree-traefik-net
    volumes:
      - ../src:/usr/src/app/src
      - ../config/app.mirror.readonly2.env:/usr/src/app/app.env
    command: >
        npm run start:dev

volumes:
  doctree-postgres-replica-data:

networks:
  doctree-postgres-net:
    external: true
  doctree-minio-net:
    external: true
  doctree-traefik-net:
    external: true